<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShardX Launcher</title>
    <script>
      // Resolve the persisted theme in <head>, before CSS and React can paint.
      const savedTheme = localStorage.getItem("shardx-theme");
      const initialTheme = savedTheme === "dark" ? "dark" : "light";
      localStorage.setItem("shardx-theme", initialTheme);
      document.documentElement.setAttribute("data-theme", initialTheme);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
