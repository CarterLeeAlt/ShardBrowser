# Build and publish the Windows x64 Tauri launcher. ShardX Launcher is a
# Windows-only portable application; no macOS, Linux, ARM64 or x86 jobs should
# be added to this workflow.
#
# Triggers:
#   * push to main             → publish the repo's current version, then bump
#                                the version files for the next run
#                                (2.0.2 → release v2.0.2 → files at 2.0.3)
#   * manual dispatch via the Actions tab → fill in a tag to pin it, or leave
#     it empty to publish the repo's current version
#
# (No `tags:` filter here on purpose: together with `branches:` GitHub treats
# it as an AND, which can never match. Pinning a version is what the dispatch
# input is for.)
#
# Version increment: patch and minor roll over at 9 (2.0.9 → 2.1.0,
# 2.9.9 → 3.0.0); a tag that already exists is skipped to the next free one.
# The bump commit is authored by github-actions[bot] with [skip ci], and a
# GITHUB_TOKEN push never triggers workflows in the first place.
#
# Artifact attached to the Release: Windows x64 portable .exe only.
# No Authenticode certificate is configured, so SmartScreen may warn.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.5). Leave empty to publish the repo version.'
        required: false

# Queue concurrent runs (back-to-back pushes) instead of cancelling: the
# second run resolves versions after the first one published, so its tag
# never collides.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # needed to create / attach assets to releases and to push the version bump

jobs:
  prepare:
    runs-on: windows-latest
    name: resolve release version
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          # Manual dispatch with a filled-in tag and tag pushes pin the
          # version; everything else auto-publishes the repo's version.
          $explicit = $null
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:INPUT_TAG -and $env:INPUT_TAG.Trim()) {
              $explicit = $env:INPUT_TAG.Trim()
            }
          } elseif ($env:EVENT_NAME -eq "push" -and $env:REF_NAME -like "v*") {
            $explicit = $env:REF_NAME
          }

          $base = (node -p "require('./package.json').version").Trim()

          # Tags that already exist on the origin, so the resolver can skip
          # past any of them instead of failing on a duplicate release.
          $taken = (git ls-remote --tags origin) | ForEach-Object {
            if ($_ -match "refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$") { $Matches[1] }
          } | Select-Object -Unique
          $taken = ($taken -join " ").Trim()

          if ($explicit) {
            $out = node scripts/next-release-version.mjs --explicit $explicit --taken "$taken"
          } else {
            $out = node scripts/next-release-version.mjs --base $base --taken "$taken"
          }
          $tag = (($out | Where-Object { $_ -like "tag=*" }) -replace "^tag=", "").Trim()
          $version = (($out | Where-Object { $_ -like "version=*" }) -replace "^version=", "").Trim()

          # Version the next run should start from; written back after the
          # release succeeds.
          $next = (node scripts/next-release-version.mjs --base $version --next |
            Where-Object { $_ -like "version=*" }) -replace "^version=", ""
          $next = "$next".Trim()

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "next_version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    needs: prepare
    runs-on: windows-latest
    name: build (Windows x64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable, Windows x64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry + build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: win-x64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            win-x64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable Tauri executable (unsigned)
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Pass the override as a file. PowerShell's native-command argument
          # conversion strips the quotes from inline JSON, turning
          # {"version":"0.1.1"} into the invalid {version:0.1.1}.
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-release-config.json"
          $config = @{ version = $env:APP_VERSION } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            $configPath,
            $config,
            [System.Text.UTF8Encoding]::new($false)
          )
          npx tauri build --no-bundle --target x86_64-pc-windows-msvc --config $configPath

      - name: Collect Windows portable binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          # Tauri renames the binary to the product name; fall back to the
          # cargo package name in case that changes.
          $src = Join-Path $rel "ShardX Launcher.exe"
          if (-not (Test-Path -LiteralPath $src)) {
            $src = Join-Path $rel "shardx-launcher.exe"
          }
          Copy-Item -LiteralPath $src -Destination "staging/ShardX-Launcher-portable-${{ needs.prepare.outputs.version }}-win-x64.exe" -Verbose
          Get-ChildItem staging

      - name: Upload to workflow artifacts (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: shardx-launcher-win-x64
          path: staging/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: windows-latest
    name: publish release
    steps:
      - name: Checkout main (for the version bump)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected portable binaries
        shell: pwsh
        run: Get-ChildItem -Path dist -Recurse

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ShardX Launcher ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            **Windows x64 only** — run `ShardX-Launcher-portable-${{ needs.prepare.outputs.version }}-win-x64.exe` directly. No installer is produced. All launcher state is stored in the adjacent `shardx-launcher` directory, so keep that directory with the EXE when moving or backing up the launcher. The portable build uses the Evergreen WebView2 runtime included with Windows 10/11. Because the binary is not Authenticode-signed, SmartScreen may require **More info → Run anyway**.

            On first launch the launcher downloads the patched ShardX browser, Widevine CDM and a starter library of 170 device profiles from our CDN.  After that it boots straight to the workspace.
          files: dist/*

      - name: Bump version files for the next run
        continue-on-error: true   # a failed bump must not fail the release
        shell: pwsh
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $old = (node -p "require('./package.json').version").Trim()
          if ([version]$env:NEW_VERSION -le [version]$old) {
            "Version files already at $old; publishing $env:NEW_VERSION does not move the version forward (pinned tag?). Nothing to bump."
            exit 0
          }

          # Keep only the tail of the files we touch intact: -Raw + -NoNewline
          # preserves whatever line endings each file already uses.
          $jsonOld = '"version": "' + $old + '"'
          $jsonNew = '"version": "' + $env:NEW_VERSION + '"'
          foreach ($file in @("package.json", "src-tauri/tauri.conf.json")) {
            $text = Get-Content $file -Raw
            if (-not $text.Contains($jsonOld)) {
              throw "Expected '$jsonOld' not found in $file; refusing to bump blindly."
            }
            [System.IO.File]::WriteAllText($file, $text.Replace($jsonOld, $jsonNew), [System.Text.UTF8Encoding]::new($false))
          }
          $tomlOld = 'version = "' + $old + '"'
          $tomlNew = 'version = "' + $env:NEW_VERSION + '"'
          $toml = Get-Content src-tauri/Cargo.toml -Raw
          if (-not $toml.Contains($tomlOld)) {
            throw "Expected '$tomlOld' not found in src-tauri/Cargo.toml; refusing to bump blindly."
          }
          [System.IO.File]::WriteAllText("src-tauri/Cargo.toml", $toml.Replace($tomlOld, $tomlNew), [System.Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "ci: bump version to $env:NEW_VERSION [skip ci]"
          git push origin HEAD:main
