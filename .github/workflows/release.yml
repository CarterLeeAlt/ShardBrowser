# Build and publish the Windows x64 Tauri launcher. ShardX Launcher is a
# Windows-only portable application; no macOS, Linux, ARM64 or x86 jobs should
# be added to this workflow.
#
# Triggers:
#   * pushing a tag like `v1.2.3`  → release named "ShardX Launcher v1.2.3"
#   * manual dispatch via the Actions tab (handy for ad-hoc builds)
#
# Artifacts attached to the Release: Windows x64 .msi + portable .exe.
# No Authenticode certificate is configured, so SmartScreen may warn.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Required for manual runs.'
        required: true

permissions:
  contents: write   # needed to create / attach assets to releases

jobs:
  prepare:
    runs-on: windows-latest
    name: validate release version
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate and resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:INPUT_TAG
          } else {
            $env:REF_NAME
          }
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid release tag '$tag'. Expected vMAJOR.MINOR.PATCH (for example, v0.1.15)."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    needs: prepare
    runs-on: windows-latest
    name: build (Windows x64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable, Windows x64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry + build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: win-x64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            win-x64-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundle (unsigned)
        shell: pwsh
        run: |
          $config = '{"version":"${{ needs.prepare.outputs.version }}"}'
          npx tauri build --target x86_64-pc-windows-msvc --config $config

      - name: Collect Windows MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $msi = @(Get-ChildItem -Path $bundle -Recurse -File -Filter *.msi)
          if ($msi.Count -eq 0) {
            throw "Tauri produced no Windows x64 MSI under $bundle"
          }
          $msi | Copy-Item -Destination staging -Verbose
          Get-ChildItem staging

      # The raw compiled binary (one level above bundle/) is a standalone,
      # installer-free executable — no MSI/NSIS, no admin, just run it. It uses
      # the system's Evergreen WebView2 (preinstalled on Windows 10/11). Ship it
      # as the portable build alongside the installers.
      - name: Collect Windows portable binary
        shell: pwsh
        run: |
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          # Tauri renames the binary to the product name; fall back to the
          # cargo package name in case that changes.
          $src = Join-Path $rel "ShardX Launcher.exe"
          if (-not (Test-Path -LiteralPath $src)) {
            $src = Join-Path $rel "shardx-launcher.exe"
          }
          Copy-Item -LiteralPath $src -Destination "staging/ShardX-Launcher-portable-${{ needs.prepare.outputs.version }}-win-x64.exe" -Verbose
          Get-ChildItem staging

      - name: Upload to workflow artifacts (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: shardx-launcher-win-x64
          path: staging/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: windows-latest
    name: publish release
    steps:
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected bundles
        shell: pwsh
        run: Get-ChildItem -Path dist -Recurse

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ShardX Launcher ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            **Windows x64 only** — use the `.msi` installer or the installer-free `ShardX-Launcher-portable-${{ needs.prepare.outputs.version }}-win-x64.exe`. The portable build uses the Evergreen WebView2 runtime included with Windows 10/11. Because the binaries are not Authenticode-signed, SmartScreen may require **More info → Run anyway**.

            On first launch the launcher downloads the patched ShardX browser, Widevine CDM and a starter library of 170 device profiles from our CDN.  After that it boots straight to the workspace.
          files: dist/*
