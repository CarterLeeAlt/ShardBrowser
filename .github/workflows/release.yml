# Build and publish the Windows x64 Tauri launcher. ShardX Launcher is a
# Windows-only portable application; no macOS, Linux, ARM64 or x86 jobs should
# be added to this workflow.
#
# Releases always use the version declared in the source tree. A supplied tag
# must exactly match that version, and the next version is committed only after
# a successful release.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish; it must equal the source version (for example, v2.0.5)."
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: windows-2022
    name: resolve release version
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bootstrap repository-local Node
        shell: pwsh
        run: ./scripts/bootstrap-ci-toolchains.ps1 -Node

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          # pwsh does not stop on non-zero native exits by default; check
          # $LASTEXITCODE explicitly or a failed helper silently yields empty
          # tag/version values that bypass every later guard.
          function Assert-NativeExit([string] $Step) {
            if ($LASTEXITCODE -ne 0) { throw "$Step failed with exit $LASTEXITCODE." }
          }

          if ($env:WORKFLOW_REF -ne "refs/heads/main") {
            throw "Releases may run only from refs/heads/main; received $env:WORKFLOW_REF."
          }

          $explicit = $null
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_TAG -and $env:INPUT_TAG.Trim()) {
            $explicit = $env:INPUT_TAG.Trim()
          }

          $base = (node -p "require('./package.json').version").Trim()
          Assert-NativeExit "read package.json version"
          if ($explicit) {
            $out = node scripts/next-release-version.mjs --explicit $explicit
          } else {
            $out = node scripts/next-release-version.mjs --base $base
          }
          Assert-NativeExit "next-release-version"
          $tag = (($out | Where-Object { $_ -like "tag=*" }) -replace "^tag=", "").Trim()
          $version = (($out | Where-Object { $_ -like "version=*" }) -replace "^version=", "").Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Resolved release tag '$tag' is not a valid vMAJOR.MINOR.PATCH tag."
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Resolved release version '$version' is not valid."
          }

          # A release tag must name exactly the version checked into all source
          # manifests. This also prevents auto-skipping a previously published
          # tag while building a binary whose sources still declare an older one.
          node scripts/check-version-consistency.mjs --tag $tag
          Assert-NativeExit "check-version-consistency"

          # Publishing a pre-existing tag would mutate its Release assets. Both
          # automatic and manual runs therefore fail before the build begins.
          git ls-remote --exit-code --refs origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag $tag already exists on origin."
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Could not check whether release tag $tag exists on origin (git exit $LASTEXITCODE)."
          }

          $next = (node scripts/next-release-version.mjs --base $version --next |
            Where-Object { $_ -like "version=*" }) -replace "^version=", ""
          $next = "$next".Trim()
          Assert-NativeExit "next-release-version --next"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "next_version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    needs: prepare
    runs-on: windows-2022
    name: build (Windows x64)
    permissions:
      contents: read
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}\.cache\npm
      CARGO_HOME: ${{ github.workspace }}\.cache\tools\cargo
      RUSTUP_HOME: ${{ github.workspace }}\.cache\tools\rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}\.cache\target
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore repository-local toolchains and dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache
          key: release-win2022-x64-node22.14.0-rust1.98.1-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            release-win2022-x64-node22.14.0-rust1.98.1-

      - name: Bootstrap repository-local Node and Rust
        shell: pwsh
        run: ./scripts/bootstrap-ci-toolchains.ps1 -Node -Rust

      - name: Check source version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Upstream release tag '$env:RELEASE_TAG' is not a valid vMAJOR.MINOR.PATCH tag."
          }
          node scripts/check-version-consistency.mjs --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "check-version-consistency failed with exit $LASTEXITCODE." }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint launcher Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test launcher Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc

      - name: Build portable Tauri executable (unsigned)
        shell: pwsh
        run: .\node_modules\.bin\tauri.cmd build --no-bundle --target x86_64-pc-windows-msvc -- --locked

      - name: Collect Windows portable binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          $rel = ".cache/target/x86_64-pc-windows-msvc/release"
          $src = Join-Path $rel "ShardX Launcher.exe"
          if (-not (Test-Path -LiteralPath $src)) {
            $src = Join-Path $rel "shardx-launcher.exe"
          }
          Copy-Item -LiteralPath $src -Destination "staging/ShardX-Launcher-portable-win-x64.exe" -Verbose
          Get-ChildItem staging

      # The self-contained bundle is assembled from the archives snapshotted on
      # the `runtime-archive` release by the "Sync runtime archive" workflow.
      # That release must exist and be seeded before this workflow can succeed.
      - name: Download runtime archive snapshot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .runtime-archive | Out-Null
          gh release download runtime-archive --repo ${{ github.repository }} --dir .runtime-archive --clobber
          $required = "ShardX-Windows.zip", "ShardX-Widevine-Win.zip", "ShardX-Fingerprints.zip", "runtime-archive.json"
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path ".runtime-archive" $name))) {
              throw "The runtime-archive release is missing $name; run the 'Sync runtime archive' workflow first."
            }
          }

      - name: Build self-contained bundle
        shell: pwsh
        run: |
          node scripts/build-selfcontained.mjs `
            --exe "staging/ShardX-Launcher-portable-win-x64.exe" `
            --zips ".runtime-archive" `
            --out "staging/ShardX-Launcher-selfcontained-win-x64.zip"
          Get-ChildItem staging

      - name: Upload to workflow artifacts (intermediate)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shardx-launcher-win-x64
          path: staging/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: windows-2022
    name: publish release
    permissions:
      contents: write
    steps:
      - name: Checkout release source (for the version bump)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bootstrap repository-local Node
        shell: pwsh
        run: ./scripts/bootstrap-ci-toolchains.ps1 -Node

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Assert release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Upstream release tag '$env:RELEASE_TAG' is not a valid vMAJOR.MINOR.PATCH tag."
          }

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ShardX Launcher ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            **Windows x64 only** — run `ShardX-Launcher-portable-win-x64.exe` directly. The filename is version-free on purpose: replace the old exe in place and existing shortcuts keep working (the release tag shows the version). No installer is produced. All launcher state is stored in the adjacent `shardx-launcher` directory, so keep that directory with the EXE when moving or backing up the launcher. The portable build uses the Evergreen WebView2 runtime included with Windows 10/11. Because the binary is not Authenticode-signed, SmartScreen may require **More info → Run anyway**.

            On first launch the launcher downloads the patched ShardX browser, Widevine CDM and a starter library of 170 device profiles from our CDN. After that it boots straight to the workspace.

            **Self-contained variant** — `ShardX-Launcher-selfcontained-win-x64.zip` bundles the launcher with the browser runtime, Widevine CDM and fingerprint library already installed: extract the folder anywhere and run `ShardX Launcher.exe`, no first-run download. Keep the `shardx-launcher` directory next to the EXE. The bundled runtime is the snapshot taken when this release was built; later runtime updates arrive through the launcher's own update check as usual.
          files: dist/*

      - name: Bump version files for the next run
        shell: pwsh
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $old = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { throw "read package.json version failed with exit $LASTEXITCODE." }
          if ([version]$env:NEW_VERSION -le [version]$old) {
            "Version files already at $old; publishing $env:NEW_VERSION does not move the version forward (pinned tag?). Nothing to bump."
            exit 0
          }

          node scripts/bump-release-version.mjs --from $old --to $env:NEW_VERSION
          if ($LASTEXITCODE -ne 0) { throw "bump-release-version failed with exit $LASTEXITCODE." }
          node scripts/check-version-consistency.mjs
          if ($LASTEXITCODE -ne 0) { throw "check-version-consistency failed with exit $LASTEXITCODE." }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "ci: bump version to $env:NEW_VERSION [skip ci]"
          git push origin HEAD:main
