[package]
name = "shardx-launcher"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The desktop binary links this library directly; mobile static/dynamic library
# outputs are intentionally omitted from the Windows-only project.
name = "shardx_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "fs", "net", "io-util", "time", "sync"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
unicode-segmentation = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json"] }
base64 = "0.22"
# Local automation HTTP API (axum) + JWT bearer auth.
axum = "0.7"
jsonwebtoken = "9"
# Cookie import/export from the profile's Chromium Cookies SQLite DB.
# Windows values use AES-256-GCM with a DPAPI-protected OSCrypt key.
# MCP bootstrap: download the server tarball from GitHub + extract.
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Self-bootstrapping runtime: zip extraction of the chrome bundle
# downloaded from Cloudflare R2 on first launch (src/runtime.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Windows cookie crypto: AES-256-GCM + DPAPI key from Local State.
aes-gcm = "0.10"
getrandom = "0.2"
ico = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",            # HLOCAL + LocalFree live here in 0.59
    "Win32_Security_Cryptography", # CryptProtectData / CryptUnprotectData
    "Win32_System_SystemInformation", # GlobalMemoryStatusEx
    "Win32_UI_WindowsAndMessaging", # Native startup path error dialog
] }
